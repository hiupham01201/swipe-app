<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Swipe & Vote</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F2EE;
    --card-bg: #FFFFFF;
    --text: #1A1714;
    --text-muted: #9A948D;
    --like: #3DBE7A;
    --dislike: #E85444;
    --like-bg: #EDFBF3;
    --dislike-bg: #FEF0EE;
    --shadow: 0 8px 40px rgba(26,23,20,0.10);
    --shadow-hover: 0 20px 60px rgba(26,23,20,0.16);
    --radius: 20px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    color: var(--text);
  }

  /* Subtle background texture */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: radial-gradient(circle at 20% 20%, rgba(61,190,122,0.06) 0%, transparent 50%),
                      radial-gradient(circle at 80% 80%, rgba(232,84,68,0.06) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .app { position: relative; z-index: 1; width: 100%; max-width: 420px; }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 36px;
  }
  .header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    letter-spacing: -0.5px;
    color: var(--text);
  }
  .header p {
    font-size: 0.85rem;
    color: var(--text-muted);
    margin-top: 6px;
    font-weight: 300;
  }

  /* Progress */
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }
  .progress-bar {
    flex: 1;
    height: 3px;
    background: rgba(26,23,20,0.10);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--text);
    border-radius: 99px;
    transition: width 0.4s ease;
  }
  .progress-label {
    font-size: 0.78rem;
    color: var(--text-muted);
    white-space: nowrap;
    font-weight: 500;
  }

  /* Card stack */
  .card-stack {
    position: relative;
    width: 100%;
    height: 460px;
    margin-bottom: 32px;
  }

  .card {
    position: absolute;
    inset: 0;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    will-change: transform;
    transition: box-shadow 0.2s;
  }
  .card:active { cursor: grabbing; }

  .card-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    pointer-events: none;
    user-select: none;
  }

  .card-label {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 28px 24px 24px;
    background: linear-gradient(to top, rgba(0,0,0,0.55) 0%, transparent 100%);
    color: #fff;
  }
  .card-label h3 {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: -0.2px;
  }

  /* Background cards */
  .card.back-1 {
    transform: scale(0.96) translateY(10px);
    z-index: 1;
    pointer-events: none;
    cursor: default;
  }
  .card.back-2 {
    transform: scale(0.92) translateY(20px);
    z-index: 0;
    pointer-events: none;
    cursor: default;
  }
  .card.top { z-index: 5; }

  /* Color wash on drag */
  .like-wash, .dislike-wash {
    position: absolute; inset: 0;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.05s;
    z-index: 10;
    border-radius: var(--radius);
  }
  .like-wash { background: rgba(61,190,122,0.18); }
  .dislike-wash { background: rgba(232,84,68,0.18); }

  /* Buttons */
  .actions {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
  }

  .btn {
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    transition: transform 0.15s cubic-bezier(.34,1.56,.64,1), box-shadow 0.15s;
    position: relative;
    overflow: hidden;
  }
  .btn::after {
    content: '';
    position: absolute; inset: 0;
    background: rgba(255,255,255,0.2);
    opacity: 0;
    transition: opacity 0.15s;
  }
  .btn:hover::after { opacity: 1; }
  .btn:hover { transform: scale(1.10); box-shadow: var(--shadow-hover); }
  .btn:active { transform: scale(0.97); }

  .btn-dislike {
    width: 68px; height: 68px;
    background: var(--dislike-bg);
    box-shadow: 0 4px 20px rgba(232,84,68,0.15);
  }
  .btn-like {
    width: 68px; height: 68px;
    background: var(--like-bg);
    box-shadow: 0 4px 20px rgba(61,190,122,0.15);
  }

  .btn svg { display: block; }

  /* Loading & empty states */
  .state-card {
    position: absolute; inset: 0;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 10;
    padding: 32px;
    text-align: center;
  }
  .state-icon { font-size: 3rem; }
  .state-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.4rem;
  }
  .state-sub {
    font-size: 0.85rem;
    color: var(--text-muted);
    line-height: 1.6;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid rgba(26,23,20,0.1);
    border-top-color: var(--text);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Done state */
  .done-stats {
    display: flex;
    gap: 24px;
    margin-top: 8px;
  }
  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .stat-num {
    font-family: 'DM Serif Display', serif;
    font-size: 2rem;
    line-height: 1;
  }
  .stat-num.like { color: var(--like); }
  .stat-num.dislike { color: var(--dislike); }
  .stat-label { font-size: 0.75rem; color: var(--text-muted); }

  .btn-restart {
    margin-top: 16px;
    padding: 10px 24px;
    background: var(--text);
    color: #fff;
    border: none;
    border-radius: 99px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.15s;
  }
  .btn-restart:hover { opacity: 0.8; transform: scale(1.03); }

  /* Error */
  .error-msg {
    font-size: 0.75rem;
    color: var(--dislike);
    text-align: center;
    margin-top: 12px;
    min-height: 18px;
  }

  @media (max-width: 480px) {
    .card-stack { height: 400px; }
    .header h1 { font-size: 1.6rem; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>Swipe & Vote</h1>
    <p>Quẹt phải nếu thích, quẹt trái nếu không</p>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="progress-label" id="progressLabel">0 / 0</div>
  </div>

  <div class="card-stack" id="stack">
    <div class="state-card">
      <div class="spinner"></div>
      <div class="state-sub">Đang tải hình ảnh...</div>
    </div>
  </div>

  <div class="actions" id="actions">
    <button class="btn btn-dislike" id="btnDislike" onclick="triggerSwipe('left')" title="Dislike">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path d="M18 6L6 18M6 6l12 12" stroke="#E85444" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="btn btn-like" id="btnLike" onclick="triggerSwipe('right')" title="Like">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z" stroke="#3DBE7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="error-msg" id="errorMsg"></div>
</div>

<script>
// ─── CONFIG ───────────────────────────────────────────────
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwXwmMNCOm5k5-VvrQ7-zEF0V9nFIppL4q_6ZGcNcFufS5FowCBm7uQ-nc2w7sIiIJP/exec";

// ─── STATE ────────────────────────────────────────────────
let images = [];
let queue  = [];
let likeCount = 0, dislikeCount = 0;
let isSwiping = false;

// Anonymous session ID (persists per browser tab)
const SESSION_ID = Math.random().toString(36).slice(2) + Date.now().toString(36);

// ─── INIT ─────────────────────────────────────────────────
async function init() {
  try {
    const res = await fetch(APPS_SCRIPT_URL);
    const data = await res.json();
    images = data.images || [];

    if (images.length === 0) {
      showEmpty("Chưa có hình nào", "Hãy thêm hình vào tab Config trong Google Sheet.");
      return;
    }

    queue = [...images];
    buildStack();
  } catch (err) {
    showEmpty("Không tải được dữ liệu", "Kiểm tra lại Apps Script URL hoặc kết nối mạng.\n\n" + err.message);
  }
}

// ─── BUILD STACK ──────────────────────────────────────────
function buildStack() {
  const stack = document.getElementById('stack');
  stack.innerHTML = '';

  if (queue.length === 0) { showDone(); return; }

  const visible = queue.slice(0, 3);
  // Render back cards first (index 0 = furthest back)
  visible.slice(1).reverse().forEach((img, i) => {
    const card = makeCard(img, false, i === 0 ? 'back-2' : 'back-1');
    stack.appendChild(card);
  });

  // Top card last
  const topCard = makeCard(visible[0], true, 'top');
  stack.appendChild(topCard);

  updateProgress();
}

// ─── MAKE CARD ────────────────────────────────────────────
function makeCard(img, isTop, cls) {
  const card = document.createElement('div');
  card.className = `card ${cls}`;

  const likeWash    = document.createElement('div'); likeWash.className = 'like-wash';
  const dislikeWash = document.createElement('div'); dislikeWash.className = 'dislike-wash';

  const image = document.createElement('img');
  image.className = 'card-img';
  image.src = img.url;
  image.alt = img.name;
  image.draggable = false;

  const label = document.createElement('div');
  label.className = 'card-label';
  label.innerHTML = `<h3>${img.name}</h3>`;

  card.append(likeWash, dislikeWash, image, label);

  if (!isTop) return card;

  // ── Drag logic ────────────────────────────────────────
  let startX, startY, currentX = 0, currentY = 0, dragging = false;

  function onStart(x, y) {
    if (isSwiping) return;
    dragging = true;
    startX = x; startY = y;
    card.style.transition = 'none';
  }

  function onMove(x, y) {
    if (!dragging) return;
    currentX = x - startX;
    currentY = (y - startY) * 0.3;
    const rotate = currentX * 0.06;
    card.style.transform = `translate(${currentX}px,${currentY}px) rotate(${rotate}deg)`;

    const ratio = Math.min(Math.abs(currentX) / 120, 1);
    if (currentX > 0) { likeWash.style.opacity = ratio; dislikeWash.style.opacity = 0; }
    else              { dislikeWash.style.opacity = ratio; likeWash.style.opacity = 0; }
  }

  function onEnd() {
    if (!dragging) return;
    dragging = false;
    card.style.transition = 'transform 0.35s cubic-bezier(.25,.8,.25,1), opacity 0.35s';

    if      (currentX >  110) flyOut('right', card, img);
    else if (currentX < -110) flyOut('left',  card, img);
    else {
      card.style.transform = '';
      likeWash.style.opacity = 0;
      dislikeWash.style.opacity = 0;
    }
    currentX = 0; currentY = 0;
  }

  card.addEventListener('mousedown',  e => onStart(e.clientX, e.clientY));
  window.addEventListener('mousemove', e => { if (dragging) onMove(e.clientX, e.clientY); });
  window.addEventListener('mouseup',   onEnd);

  card.addEventListener('touchstart', e => onStart(e.touches[0].clientX, e.touches[0].clientY), {passive:true});
  card.addEventListener('touchmove',  e => { e.preventDefault(); onMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive:false});
  card.addEventListener('touchend',   onEnd);

  card._flyOut = (dir) => flyOut(dir, card, img);
  return card;
}

// ─── FLY OUT ──────────────────────────────────────────────
function flyOut(dir, card, img) {
  if (isSwiping) return;
  isSwiping = true;

  const tx = dir === 'right' ? 700 : -700;
  card.style.transition = 'transform 0.4s cubic-bezier(.4,0,.2,1), opacity 0.4s';
  card.style.transform  = `translate(${tx}px, 30px) rotate(${tx * 0.04}deg)`;
  card.style.opacity    = '0';

  const vote = dir === 'right' ? 'like' : 'dislike';
  if (vote === 'like') likeCount++; else dislikeCount++;

  sendVote(img, vote);

  setTimeout(() => {
    queue.shift();
    buildStack();
    isSwiping = false;
  }, 400);
}

// ─── TRIGGER FROM BUTTONS ─────────────────────────────────
function triggerSwipe(dir) {
  const top = document.querySelector('.card.top');
  if (top && top._flyOut && !isSwiping) top._flyOut(dir);
}

// ─── SEND VOTE TO GOOGLE SHEETS ───────────────────────────
async function sendVote(img, vote) {
  const payload = {
    session_id: SESSION_ID,
    image_id:   img.id,
    image_name: img.name,
    vote:       vote
  };
  try {
    await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
  } catch (err) {
    document.getElementById('errorMsg').textContent = '⚠️ Không gửi được vote — kiểm tra kết nối.';
    setTimeout(() => { document.getElementById('errorMsg').textContent = ''; }, 3000);
  }
}

// ─── PROGRESS ─────────────────────────────────────────────
function updateProgress() {
  const total   = images.length;
  const done    = total - queue.length;
  const pct     = total ? (done / total * 100) : 0;
  document.getElementById('progressFill').style.width  = pct + '%';
  document.getElementById('progressLabel').textContent = `${done} / ${total}`;
}

// ─── STATES ───────────────────────────────────────────────
function showEmpty(title, sub) {
  document.getElementById('stack').innerHTML = `
    <div class="state-card">
      <div class="state-icon">🖼️</div>
      <div class="state-title">${title}</div>
      <div class="state-sub">${sub}</div>
    </div>`;
  document.getElementById('actions').style.visibility = 'hidden';
}

function showDone() {
  document.getElementById('stack').innerHTML = `
    <div class="state-card">
      <div class="state-icon">✨</div>
      <div class="state-title">Xong rồi!</div>
      <div class="state-sub">Cảm ơn bạn đã tham gia.</div>
      <div class="done-stats">
        <div class="stat">
          <div class="stat-num like">${likeCount}</div>
          <div class="stat-label">Đã thích</div>
        </div>
        <div class="stat">
          <div class="stat-num dislike">${dislikeCount}</div>
          <div class="stat-label">Không thích</div>
        </div>
      </div>
      <button class="btn-restart" onclick="restart()">Làm lại từ đầu</button>
    </div>`;
  document.getElementById('actions').style.visibility = 'hidden';
  updateProgress();
}

function restart() {
  likeCount = 0; dislikeCount = 0;
  queue = [...images];
  document.getElementById('actions').style.visibility = 'visible';
  buildStack();
}

// ─── START ────────────────────────────────────────────────
init();
</script>
</body>
</html>
